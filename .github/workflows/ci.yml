name: CI & PR E2E Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-pr-check:
    name: Comprehensive E2E PR Verification (.NET 8 & 9 + Native AOT)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore solution dependencies
        run: dotnet restore Parquet.SourceGenertor.sln

      - name: Audit Package Security & Vulnerabilities
        run: dotnet list package --vulnerable --include-transitive

      - name: Verify C# Code Formatting
        run: dotnet format --verify-no-changes --verbosity diagnostic

      - name: Generate Python Test Datasets (PyArrow v1 & v2)
        run: uv run scripts/generate_test_data.py

      - name: Generate C# Test Datasets (Parquet.Net v3)
        run: dotnet run --project test/Parquet.SourceGenerator.CLI/Parquet.SourceGenerator.CLI.csproj

      - name: Build solution (Release)
        run: dotnet build Parquet.SourceGenertor.sln --configuration Release --no-restore

      - name: Run Full Test Suite with Code Coverage Enforcement (>=80%)
        run: dotnet test Parquet.SourceGenertor.sln --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --settings coverlet.runsettings

      - name: Execute Native AOT Sample Pathway
        run: dotnet run --project samples/Parquet.SourceGenerator.SampleAot/Parquet.SourceGenerator.SampleAot.csproj --configuration Release

      - name: Pack All NuGet Packages
        run: dotnet pack Parquet.SourceGenertor.sln --configuration Release --no-build --output ./artifacts

      - name: Upload Test Coverage Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage
          path: test/Parquet.SourceGenerator.Tests/TestResults/*/coverage.cobertura.xml

      - name: Upload Build & Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts/*.nupkg
