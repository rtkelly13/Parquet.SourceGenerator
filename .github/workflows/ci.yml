name: CI & PR E2E Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job name is the check name that branch protection matches on, so it is deliberately short,
  # lowercase, and free of characters that are easy to mistype or that GitHub HTML-escapes when a
  # doc is rendered. Treat it as an identifier: renaming it silently breaks any ruleset requiring it.
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore solution dependencies
        run: dotnet restore Parquet.SourceGenertor.sln

      - name: Audit Package Security & Vulnerabilities
        run: dotnet list package --vulnerable --include-transitive

      # `whitespace` only, deliberately. Plain `dotnet format` also runs its style and analyzer
      # phases, which build a Roslyn workspace via MSBuildWorkspace — and MSBuildWorkspace does not
      # execute source generators. It logs "Found project reference without a matching metadata
      # reference" for the generator project and then reports CS1503 against every call into the
      # generated *ParquetExtensions API, because in its view that API does not exist. Those errors
      # are artifacts of the tool, not defects in the code.
      #
      # Style and analyzer rules are enforced instead by the build below, via
      # EnforceCodeStyleInBuild plus -warnaserror, which uses the real compilation where generators
      # do run.
      - name: Verify C# Code Formatting
        run: dotnet format whitespace --verify-no-changes --verbosity diagnostic

      - name: Generate Python Test Datasets (PyArrow v1 & v2)
        run: uv run scripts/generate_test_data.py

      - name: Generate C# Test Datasets (Parquet.Net v3)
        run: dotnet run --project test/Parquet.SourceGenerator.CLI/Parquet.SourceGenerator.CLI.csproj

      - name: Build solution (Release)
        run: dotnet build Parquet.SourceGenertor.sln --configuration Release --no-restore -warnaserror

      - name: Run Full Test Suite with Code Coverage Collection
        run: dotnet test Parquet.SourceGenertor.sln --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --settings coverlet.runsettings

      - name: Execute Native AOT Sample Pathway
        run: dotnet run --project samples/Parquet.SourceGenerator.SampleAot/Parquet.SourceGenerator.SampleAot.csproj --configuration Release

      - name: Pack All NuGet Packages
        run: dotnet pack Parquet.SourceGenertor.sln --configuration Release --no-build --output ./artifacts

      # Packing proves the packages build, not that they work. These two steps consume them.
      - name: Verify Package Layout
        run: |
          set -euo pipefail
          cd artifacts
          gen=$(ls Parquet.SourceGenerator.[0-9]*.nupkg)
          attrs=$(ls Parquet.SourceGenerator.Attributes.*.nupkg)
          echo "::group::$gen contents"; unzip -Z1 "$gen"; echo "::endgroup::"

          # The generator must ship as an analyzer and must NOT ship as a library: a lib/ entry
          # means consumers compile against the generator and its Roslyn-facing internals.
          unzip -Z1 "$gen" | grep -q '^analyzers/dotnet/cs/Parquet\.SourceGenerator\.dll$' \
            || { echo "FAIL: generator missing from analyzers/dotnet/cs/"; exit 1; }
          if unzip -Z1 "$gen" | grep -q '^lib/'; then
            echo "FAIL: generator package contains lib/ entries; it must be analyzer-only:"
            unzip -Z1 "$gen" | grep '^lib/'; exit 1
          fi

          # Generated code references the attributes, so the dependency has to be declared.
          unzip -p "$gen" '*.nuspec' | grep -q 'id="Parquet.SourceGenerator.Attributes"' \
            || { echo "FAIL: generator .nuspec does not depend on the Attributes package"; exit 1; }

          # The attributes package is a real runtime library and must carry assemblies.
          for tfm in netstandard2.0 netstandard2.1 net8.0; do
            unzip -Z1 "$attrs" | grep -q "^lib/$tfm/Parquet\.SourceGenerator\.Attributes\.dll$" \
              || { echo "FAIL: attributes package missing lib/$tfm"; exit 1; }
          done
          echo "Package layout OK."

      - name: Verify Package Consumption (installs the built packages)
        run: |
          set -euo pipefail
          version=$(ls artifacts/Parquet.SourceGenerator.[0-9]*.nupkg \
            | sed -E 's/.*Parquet\.SourceGenerator\.([0-9][^/]*)\.nupkg/\1/')
          echo "Consuming Parquet.SourceGenerator $version from the local feed"
          # An isolated package directory stops an already-cached copy of this version from standing
          # in for the freshly built one.
          dotnet run --project test/PackageConsumption/PackageConsumption.csproj \
            --configuration Release \
            -p:GeneratorPackageVersion="$version" \
            -p:RestorePackagesPath="$RUNNER_TEMP/consumption-packages"

      - name: Upload Test Coverage Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage
          path: test/Parquet.SourceGenerator.Tests/TestResults/*/coverage.cobertura.xml

      - name: Upload Build & Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts/*.nupkg
