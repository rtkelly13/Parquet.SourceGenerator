name: Performance Benchmarks & Baseline Verification

on:
  schedule:
    # Run comprehensive deep benchmark every Sunday at 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      job_preset:
        description: 'BenchmarkDotNet Job Preset'
        required: false
        default: 'short'
        type: choice
        options:
          - short
          - default
      scale:
        description: 'Scale (Row Counts)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - 1m
          - 100k
          - quick
      filter:
        description: 'BenchmarkDotNet filter pattern'
        required: false
        default: '*'
      target_branch:
        description: 'Branch to benchmark and commit updates to (defaults to current)'
        required: false
        default: ''
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  run-benchmarks:
    name: Run BenchmarkDotNet Performance Suite
    # Run on scheduled cron, manual dispatch, OR when a PR comment starts with /benchmark
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       startsWith(github.event.comment.body, '/benchmark'))
    runs-on: ubuntu-latest

    steps:
      - name: Resolve Target PR Branch and Execution Options
        id: pr_info
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "branch=main" >> $GITHUB_OUTPUT
            echo "is_pr=false" >> $GITHUB_OUTPUT
            echo "commit_results=true" >> $GITHUB_OUTPUT
            echo "job_flag=--job default" >> $GITHUB_OUTPUT
            echo "params_flag=" >> $GITHUB_OUTPUT
            echo "filter=*" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "issue_comment" ]; then
            # Extract PR branch name via GitHub CLI
            branch=$(gh pr view ${{ github.event.issue.number }} --repo ${{ github.repository }} --json headRefName -q .headRefName)
            echo "branch=$branch" >> $GITHUB_OUTPUT
            echo "is_pr=true" >> $GITHUB_OUTPUT
            echo "pr_number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
            echo "commit_results=false" >> $GITHUB_OUTPUT

            comment_body="${{ github.event.comment.body }}"

            # Job preset choice: default to --job short unless --deep or --default is specified
            if echo "$comment_body" | grep -q -- "--deep" || echo "$comment_body" | grep -q -- "--default"; then
              job_flag="--job default"
            else
              # --job short: 3 warmup, 3 measurement iterations
              job_flag="--job short"
            fi

            # Scale choices:
            # - /benchmark (default): full scale (1K, 10K, 100K, 1M) with short job
            # - /benchmark --1m: only 1,000,000 rows
            # - /benchmark --100k: up to 100,000 rows
            # - /benchmark --quick: 1K, 10K rows
            if echo "$comment_body" | grep -q -- "--1m"; then
              params_flag="--params Count=1000000"
            elif echo "$comment_body" | grep -q -- "--quick"; then
              params_flag="--params Count=1000,10000"
            elif echo "$comment_body" | grep -q -- "--100k"; then
              params_flag="--params Count=1000,10000,100000"
            else
              params_flag=""
            fi

            echo "job_flag=$job_flag" >> $GITHUB_OUTPUT
            echo "params_flag=$params_flag" >> $GITHUB_OUTPUT

            # Parse optional filter (ignoring flags like --job, --1m, etc.)
            custom_filter=$(echo "$comment_body" | tr ' ' '\n' | grep -v '^/benchmark' | grep -v '^-' | head -n 1)
            if [ -n "$custom_filter" ]; then
              echo "filter=$custom_filter" >> $GITHUB_OUTPUT
            else
              echo "filter=*" >> $GITHUB_OUTPUT
            fi
          else
            target="${{ github.event.inputs.target_branch }}"
            if [ -n "$target" ]; then
              echo "branch=$target" >> $GITHUB_OUTPUT
            else
              echo "branch=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            fi
            echo "is_pr=false" >> $GITHUB_OUTPUT
            echo "commit_results=true" >> $GITHUB_OUTPUT
            echo "job_flag=--job ${{ github.event.inputs.job_preset || 'short' }}" >> $GITHUB_OUTPUT

            case "${{ github.event.inputs.scale }}" in
              1m) echo "params_flag=--params Count=1000000" >> $GITHUB_OUTPUT ;;
              100k) echo "params_flag=--params Count=1000,10000,100000" >> $GITHUB_OUTPUT ;;
              quick) echo "params_flag=--params Count=1000,10000" >> $GITHUB_OUTPUT ;;
              *) echo "params_flag=" >> $GITHUB_OUTPUT ;;
            esac

            echo "filter=${{ github.event.inputs.filter || '*' }}" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr_info.outputs.branch }}
          fetch-depth: 0

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore benchmarks/Parquet.SourceGenerator.Benchmarks/Parquet.SourceGenerator.Benchmarks.csproj

      - name: Build benchmarks (Release)
        run: dotnet build benchmarks/Parquet.SourceGenerator.Benchmarks/Parquet.SourceGenerator.Benchmarks.csproj --configuration Release --no-restore

      - name: Execute BenchmarkDotNet Suite
        run: |
          echo "Executing: dotnet run -c Release --no-build -- --filter '${{ steps.pr_info.outputs.filter }}' ${{ steps.pr_info.outputs.job_flag }} ${{ steps.pr_info.outputs.params_flag }}"
          dotnet run -c Release --project benchmarks/Parquet.SourceGenerator.Benchmarks/Parquet.SourceGenerator.Benchmarks.csproj --no-build -- --filter "${{ steps.pr_info.outputs.filter }}" ${{ steps.pr_info.outputs.job_flag }} ${{ steps.pr_info.outputs.params_flag }}

      - name: Generate Headline Benchmark Summary & Update READMEs
        run: |
          dotnet run -c Release --project tools/BenchmarkSummaryGenerator/BenchmarkSummaryGenerator.csproj -- BenchmarkDotNet.Artifacts/results benchmark-summary.md --update-readme
          cat benchmark-summary.md >> $GITHUB_STEP_SUMMARY

      - name: Commit & Push Benchmark Updates to Branch
        if: steps.pr_info.outputs.commit_results == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md PACKAGE_README.md
          if ! git diff --cached --quiet; then
            git commit -m "docs(perf): update benchmark headline performance table in README"
            git push origin ${{ steps.pr_info.outputs.branch }}
          else
            echo "No changes detected in README benchmark tables."
          fi

      - name: Comment Benchmark Summary on PR
        if: steps.pr_info.outputs.is_pr == 'true'
        run: |
          gh pr comment ${{ steps.pr_info.outputs.pr_number }} --repo ${{ github.repository }} --body-file benchmark-summary.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Benchmark Results Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: |
            BenchmarkDotNet.Artifacts/results/*.csv
            BenchmarkDotNet.Artifacts/results/*.html
            BenchmarkDotNet.Artifacts/results/*.md
            BenchmarkDotNet.Artifacts/results/*.json
