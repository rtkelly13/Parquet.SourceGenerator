name: Performance Benchmarks & Baseline Verification

# Manual only. BenchmarkDotNet on shared GitHub runners is too noisy in wall-clock terms to gate
# merges on, so running it per-PR would cost minutes and produce numbers nobody could act on.
#
# Results are now compared against benchmarks/baseline.json. Allocated bytes is the gate — on a
# fixed input it is near-deterministic, so a change in it is a real change in what the code does.
# Wall-clock is reported but does not fail the run unless fail_on_time is set, because on a shared
# runner it moves tens of percent between runs of identical code and a gate nobody can act on is a
# gate that ends up switched off.
on:
  workflow_dispatch:
    inputs:
      filter:
        description: 'BenchmarkDotNet filter pattern'
        required: false
        default: '*'
      update_baseline:
        description: 'Record this run as the new baseline instead of checking against it'
        required: false
        type: boolean
        default: false
      fail_on_time:
        description: 'Also fail on wall-clock regressions (only meaningful on a quiet runner)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  run-benchmarks:
    name: Run BenchmarkDotNet Performance Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore benchmarks/Parquet.SourceGenerator.Benchmarks/Parquet.SourceGenerator.Benchmarks.csproj

      - name: Build benchmarks (Release)
        run: dotnet build benchmarks/Parquet.SourceGenerator.Benchmarks/Parquet.SourceGenerator.Benchmarks.csproj --configuration Release --no-restore

      - name: Execute BenchmarkDotNet Suite
        run: |
          dotnet run -c Release --project benchmarks/Parquet.SourceGenerator.Benchmarks/Parquet.SourceGenerator.Benchmarks.csproj --no-build -- --filter "${{ github.event.inputs.filter || '*' }}"

      - name: Generate Headline Benchmark Summary & Update READMEs
        run: |
          dotnet run -c Release --project tools/BenchmarkSummaryGenerator/BenchmarkSummaryGenerator.csproj -- BenchmarkDotNet.Artifacts/results benchmark-summary.md --update-readme
          cat benchmark-summary.md >> $GITHUB_STEP_SUMMARY

      # Runs before the baseline check so a regression still leaves the report and artifacts behind.
      # A failing gate with no evidence of what regressed is only half a signal.
      - name: Check For Performance Regressions
        if: github.event.inputs.update_baseline != 'true'
        # Passed through env rather than interpolated into the command line: a ${{ }} substitution
        # inside a run block is the injection-prone shape, and it is worth not writing even when the
        # value is a boolean the workflow itself declares.
        env:
          FAIL_ON_TIME: ${{ github.event.inputs.fail_on_time }}
        run: |
          set -euo pipefail
          extra=""
          if [ "$FAIL_ON_TIME" = "true" ]; then extra="--fail-on-time"; fi
          dotnet run -c Release --project tools/BenchmarkSummaryGenerator/BenchmarkSummaryGenerator.csproj -- \
            BenchmarkDotNet.Artifacts/results \
            --baseline benchmarks/baseline.json \
            --report benchmark-regressions.md \
            $extra
          cat benchmark-regressions.md >> $GITHUB_STEP_SUMMARY

      - name: Record This Run As The New Baseline
        if: github.event.inputs.update_baseline == 'true'
        run: |
          set -euo pipefail
          dotnet run -c Release --project tools/BenchmarkSummaryGenerator/BenchmarkSummaryGenerator.csproj -- \
            BenchmarkDotNet.Artifacts/results \
            --baseline benchmarks/baseline.json \
            --update-baseline

      # Deliberately not `always()`: a run that regressed should not open a PR replacing the
      # published README numbers with the regressed ones. On a baseline refresh this carries the new
      # baseline.json for review rather than committing numbers nobody looked at.
      - name: Create PR for Benchmark Updates (if changed)
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "docs(perf): update benchmark headline performance table in README"
          branch: "docs/update-benchmark-table"
          title: "docs(perf): update benchmark performance table in README"
          body: "Automated benchmark run completed. This PR updates the headline performance table in `README.md` and `PACKAGE_README.md`, and `benchmarks/baseline.json` if the run was a baseline refresh."
          delete-branch: true

      # always(): a failed regression check is exactly when the raw numbers are worth having.
      - name: Upload Benchmark Results Artifacts
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: benchmark-results
          path: |
            BenchmarkDotNet.Artifacts/results/*.csv
            BenchmarkDotNet.Artifacts/results/*.html
            BenchmarkDotNet.Artifacts/results/*.md
            BenchmarkDotNet.Artifacts/results/*.json
