name: Performance Benchmarks & Baseline Verification

# Manual only. BenchmarkDotNet on shared GitHub runners is too noisy to gate merges on, and
# nothing here compares results against a stored baseline yet — so running it on every push and
# pull request cost minutes per PR and produced numbers no one could act on. Trigger it
# deliberately when investigating performance.
on:
  workflow_dispatch:
    inputs:
      filter:
        description: 'BenchmarkDotNet filter pattern'
        required: false
        default: '*'

permissions:
  contents: read

jobs:
  run-benchmarks:
    name: Run BenchmarkDotNet Performance Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@39cd14951b08e74b54015e9e001cdefcf80e669f # v4.3.0
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore benchmarks/Parquet.SourceGenerator.Benchmarks/Parquet.SourceGenerator.Benchmarks.csproj

      - name: Build benchmarks (Release)
        run: dotnet build benchmarks/Parquet.SourceGenerator.Benchmarks/Parquet.SourceGenerator.Benchmarks.csproj --configuration Release --no-restore

      - name: Execute BenchmarkDotNet Suite
        run: |
          dotnet run -c Release --project benchmarks/Parquet.SourceGenerator.Benchmarks/Parquet.SourceGenerator.Benchmarks.csproj --no-build -- --filter "${{ github.event.inputs.filter || '*' }}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Headline Benchmark Summary Table
        run: |
          python3 scripts/generate_benchmark_summary.py BenchmarkDotNet.Artifacts/results benchmark-summary.md
          cat benchmark-summary.md >> $GITHUB_STEP_SUMMARY

      - name: Upload Benchmark Results Artifacts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: benchmark-results
          path: |
            BenchmarkDotNet.Artifacts/results/*.csv
            BenchmarkDotNet.Artifacts/results/*.html
            BenchmarkDotNet.Artifacts/results/*.md
            BenchmarkDotNet.Artifacts/results/*.json
