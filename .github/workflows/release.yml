name: Release & Publish NuGet

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.0.1 or 1.0.0-rc.1)'
        required: true
        type: string
      dry_run:
        description: 'Pack and verify only — do not publish to NuGet or push tag'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish Packages to NuGet.org
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Parse and validate SemVer input
        id: version
        run: |
          python3 -c "
          import sys, re
          raw = sys.argv[1]
          ver = raw[1:] if raw.startswith('v') else raw
          pattern = r'^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$'
          m = re.match(pattern, ver)
          if not m:
              print(f'FAIL: \"{raw}\" is not a valid SemVer 2.0.0 version string', file=sys.stderr)
              sys.exit(1)
          is_prerelease = 'true' if m.group(4) is not None else 'false'
          with open(sys.argv[2], 'a') as f:
              f.write(f'version={ver}\n')
              f.write(f'tag=v{ver}\n')
              f.write(f'is_prerelease={is_prerelease}\n')
          print(f'SemVer OK: version={ver}, is_prerelease={is_prerelease}')
          " "${{ inputs.version }}" "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore Parquet.SourceGenertor.sln

      - name: Generate Python Test Datasets (PyArrow v1 & v2)
        run: uv run scripts/generate_test_data.py

      - name: Generate C# Test Datasets (Parquet.Net v3)
        run: dotnet run --project test/Parquet.SourceGenerator.CLI/Parquet.SourceGenerator.CLI.csproj

      - name: Build Solution (Release)
        run: |
          dotnet build Parquet.SourceGenertor.sln --configuration Release --no-restore \
            -warnaserror -p:Version=${{ steps.version.outputs.version }}

      - name: Run Tests
        run: dotnet test Parquet.SourceGenertor.sln --configuration Release --no-build

      - name: Pack All Packages
        run: |
          dotnet pack Parquet.SourceGenertor.sln --configuration Release --no-build \
            --output ./nupkgs -p:Version=${{ steps.version.outputs.version }}

      - name: Verify Package Layout
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          cd nupkgs
          gen="Parquet.SourceGenerator.${version}.nupkg"
          genlegacy="Parquet.SourceGenerator.Legacy.${version}.nupkg"
          attrs="Parquet.SourceGenerator.Attributes.${version}.nupkg"

          test -f "$gen"       || { echo "FAIL: $gen not produced"; ls -la; exit 1; }
          test -f "$genlegacy" || { echo "FAIL: $genlegacy not produced"; ls -la; exit 1; }
          test -f "$attrs"     || { echo "FAIL: $attrs not produced"; ls -la; exit 1; }

          unzip -Z1 "$gen" | grep -q '^analyzers/dotnet/cs/Parquet\.SourceGenerator\.dll$' \
            || { echo "FAIL: generator missing from analyzers/dotnet/cs/"; exit 1; }
          unzip -Z1 "$genlegacy" | grep -q '^analyzers/dotnet/cs/Parquet\.SourceGenerator\.Legacy\.dll$' \
            || { echo "FAIL: Legacy generator missing from analyzers/dotnet/cs/"; exit 1; }
          if unzip -Z1 "$gen" | grep -q '^lib/' || unzip -Z1 "$genlegacy" | grep -q '^lib/'; then
            echo "FAIL: generator package contains lib/ entries; it must be analyzer-only:"
            exit 1
          fi
          unzip -p "$gen" '*.nuspec' | grep -q 'id="Parquet.SourceGenerator.Attributes"' \
            || { echo "FAIL: generator .nuspec does not depend on the Attributes package"; exit 1; }
          unzip -p "$genlegacy" '*.nuspec' | grep -q 'id="Parquet.SourceGenerator.Attributes"' \
            || { echo "FAIL: Legacy generator .nuspec does not depend on the Attributes package"; exit 1; }
          for tfm in netstandard2.0 netstandard2.1 net8.0 net9.0; do
            unzip -Z1 "$attrs" | grep -q "^lib/$tfm/Parquet\.SourceGenerator\.Attributes\.dll$" \
              || { echo "FAIL: attributes package missing lib/$tfm"; exit 1; }
          done
          echo "Package layout OK for $version."

      - name: Login to NuGet via OIDC (Trusted Publishing)
        if: ${{ !inputs.dry_run }}
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER || 'rtk_13' }}

      - name: Push to NuGet
        if: ${{ !inputs.dry_run }}
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push ./nupkgs/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate \
            --no-symbols

      - name: Tag Release and Push Tag to GitHub (Full Releases Only)
        if: ${{ !inputs.dry_run && steps.version.outputs.is_prerelease == 'false' }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$tag"
          git push origin "$tag"
