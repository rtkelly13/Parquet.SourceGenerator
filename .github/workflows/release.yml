name: Release & Publish NuGet

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    name: Publish to NuGet.org
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore Parquet.SourceGenertor.sln

      - name: Build Solution
        run: dotnet build Parquet.SourceGenertor.sln --configuration Release

      - name: Run Tests
        run: dotnet test Parquet.SourceGenertor.sln --configuration Release

      - name: Pack Package
        run: dotnet pack src/Parquet.SourceGenerator/Parquet.SourceGenerator.csproj --configuration Release --output ./nupkgs

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push ./nupkgs/*.nupkg --api-key $NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
