name: Release & Publish NuGet

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.0.1 or v0.0.1; full versions only)'
        required: true
        type: string
      dry_run:
        description: 'Pack and verify only — do not publish to NuGet or push tag'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish Packages to NuGet.org
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse and validate version input
        id: version
        run: |
          set -euo pipefail
          raw_version="${{ inputs.version }}"
          version="${raw_version#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "FAIL: version input '$raw_version' must be a full version (MAJOR.MINOR.PATCH, no pre-release suffixes)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Preparing release $version (tag v$version)"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore Parquet.SourceGenertor.sln

      - name: Generate Python Test Datasets (PyArrow v1 & v2)
        run: uv run scripts/generate_test_data.py

      - name: Generate C# Test Datasets (Parquet.Net v3)
        run: dotnet run --project test/Parquet.SourceGenerator.CLI/Parquet.SourceGenerator.CLI.csproj

      - name: Build Solution (Release)
        run: |
          dotnet build Parquet.SourceGenertor.sln --configuration Release --no-restore \
            -warnaserror -p:Version=${{ steps.version.outputs.version }}

      - name: Run Tests
        run: dotnet test Parquet.SourceGenertor.sln --configuration Release --no-build

      - name: Pack All Packages
        run: |
          dotnet pack Parquet.SourceGenertor.sln --configuration Release --no-build \
            --output ./nupkgs -p:Version=${{ steps.version.outputs.version }}

      - name: Verify Package Layout
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          cd nupkgs
          gen="Parquet.SourceGenerator.${version}.nupkg"
          attrs="Parquet.SourceGenerator.Attributes.${version}.nupkg"

          test -f "$gen"   || { echo "FAIL: $gen not produced"; ls -la; exit 1; }
          test -f "$attrs" || { echo "FAIL: $attrs not produced"; ls -la; exit 1; }

          unzip -Z1 "$gen" | grep -q '^analyzers/dotnet/cs/Parquet\.SourceGenerator\.dll$' \
            || { echo "FAIL: generator missing from analyzers/dotnet/cs/"; exit 1; }
          if unzip -Z1 "$gen" | grep -q '^lib/'; then
            echo "FAIL: generator package contains lib/ entries; it must be analyzer-only:"
            unzip -Z1 "$gen" | grep '^lib/'; exit 1
          fi
          unzip -p "$gen" '*.nuspec' | grep -q 'id="Parquet.SourceGenerator.Attributes"' \
            || { echo "FAIL: generator .nuspec does not depend on the Attributes package"; exit 1; }
          for tfm in netstandard2.0 netstandard2.1 net8.0; do
            unzip -Z1 "$attrs" | grep -q "^lib/$tfm/Parquet\.SourceGenerator\.Attributes\.dll$" \
              || { echo "FAIL: attributes package missing lib/$tfm"; exit 1; }
          done
          echo "Package layout OK for $version."

      - name: Login to NuGet via OIDC (Trusted Publishing)
        if: ${{ !inputs.dry_run }}
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER || 'rtkelly13' }}

      - name: Push to NuGet
        if: ${{ !inputs.dry_run }}
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push ./nupkgs/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Tag Release and Push Tag to GitHub
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$tag"
          git push origin "$tag"
