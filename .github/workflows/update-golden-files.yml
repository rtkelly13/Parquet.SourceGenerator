name: Update Golden Code Generation Files

# Refreshes both artefacts the golden suite owns: the full generated sources
# (GoldenFiles/*.g.cs) and the signature-only public API baselines emitted beside them
# (GoldenFiles/*.api.txt, see docs/17-GENERATED-API-BASELINES.md). Both are written by the same
# UPDATE_GOLDEN_FILES pass, so they cannot drift apart.

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to update golden files on (defaults to current)'
        required: false
        default: ''
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  update-golden:
    name: Update Golden Code Generation Files
    # Run on manual dispatch OR when an authorized user comments /update-golden on a PR
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(fromJson('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
       startsWith(github.event.comment.body, '/update-golden'))
    runs-on: ubuntu-latest

    steps:
      - name: Resolve Target PR Branch
        id: pr_info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          TARGET_BRANCH_INPUT: ${{ github.event.inputs.target_branch }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            head_repo=$(gh pr view "$ISSUE_NUMBER" --repo "$REPO" --json headRepository -q .headRepository.nameWithOwner)
            if [ "$head_repo" != "$REPO" ]; then
              echo "::error::Cannot update golden files on PRs from external forks ($head_repo)."
              exit 1
            fi
            branch=$(gh pr view "$ISSUE_NUMBER" --repo "$REPO" --json headRefName -q .headRefName)
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
            echo "is_pr=true" >> "$GITHUB_OUTPUT"
            echo "pr_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          else
            target="$TARGET_BRANCH_INPUT"
            if [ -n "$target" ]; then
              echo "branch=$target" >> "$GITHUB_OUTPUT"
            else
              echo "branch=$REF_NAME" >> "$GITHUB_OUTPUT"
            fi
            echo "is_pr=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.pr_info.outputs.branch }}
          fetch-depth: 0

      # 10.0.x is required by the file-based `dotnet run scripts/*.cs` apps (the metrics
      # regeneration below); 8.0.x is what the solution builds against.
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore Parquet.SourceGenertor.sln

      - name: Regenerate Golden Files And API Baselines
        run: |
          UPDATE_GOLDEN_FILES=true dotnet test test/Parquet.SourceGenerator.Tests/Parquet.SourceGenerator.Tests.csproj \
            --configuration Release \
            --filter "FullyQualifiedName~GoldenCodeGenRegressionTests"

      # docs/21-CODE-METRICS.md. Same refresh verb, same commit, so a change that moves both the
      # emitted surface and the maintainability of the code that emits it lands as one diff.
      - name: Regenerate Code Metrics Baselines
        run: UPDATE_GOLDEN_FILES=true dotnet run scripts/CodeMetrics.cs

      - name: Commit & Push Updated Golden Files to Branch
        id: git_status
        env:
          BRANCH: ${{ steps.pr_info.outputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add test/Parquet.SourceGenerator.Tests/GoldenFiles/ metrics/
          if ! git diff --cached --quiet; then
            git commit -m "test(generator): update golden generated code, API baselines and code metrics"
            git push origin "$BRANCH"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes detected in golden files."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment on PR
        if: steps.pr_info.outputs.is_pr == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr_info.outputs.pr_number }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ steps.pr_info.outputs.branch }}
          HAS_CHANGES: ${{ steps.git_status.outputs.has_changes }}
        run: |
          if [ "$HAS_CHANGES" = "true" ]; then
            gh pr comment "$PR_NUMBER" --repo "$REPO" \
              --body "✅ Successfully regenerated and committed the source-controlled golden generated C# files and public API baselines to branch \`$BRANCH\`."
          else
            gh pr comment "$PR_NUMBER" --repo "$REPO" \
              --body "ℹ️ The source-controlled golden generated files and public API baselines on \`$BRANCH\` are already up to date."
          fi
